<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TM Case Lab | Bài nộp học viên</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f8;color:#242330;font:14px/1.65 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #e9e5e9;padding:20px 28px;font-weight:800}header b{color:#b92d69}main{max-width:1250px;margin:auto;padding:28px}h1{margin:0;font-size:28px;letter-spacing:-.6px}h2{margin:0 0 12px;font-size:18px}p{margin:8px 0}.muted{color:#696773;font-size:12px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}input,select{min-width:180px;padding:11px;border:1px solid #ded9e0;border-radius:8px;font:inherit;background:#fff}input{flex:1}button{font:inherit;cursor:pointer;border:1px solid #ded9e0;border-radius:8px;padding:10px;background:white;color:#242330}button:disabled{cursor:wait;opacity:.6}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b92d6980;outline-offset:2px}.case-group{background:white;border:1px solid #e9e5e9;border-radius:12px;overflow:hidden;margin:20px 0}.case-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:18px 22px;background:#fff5f9;border-bottom:1px solid #eadce2}.case-heading h2{margin:0;color:#a72e60}.case-heading span{white-space:nowrap}.answers-table{width:100%;border-collapse:collapse;table-layout:fixed}.answers-table th{text-align:left;background:#fcfbfc;font-size:12px;color:#696773;padding:10px 22px}.answers-table td{vertical-align:top;padding:18px 22px;border-top:1px solid #eee9ee}.name-col{width:25%}.time-col{width:18%}.student-name{font-weight:700;overflow-wrap:anywhere}.submission-time{color:#696773;font-size:12px;overflow-wrap:anywhere}.answer{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.75}.empty{padding:28px;background:white;border:1px solid #e9e5e9;border-radius:12px;color:#696773}#status{min-height:20px}#error{color:#a32347}#error:empty{display:none}label{display:block;font-size:12px;font-weight:650;margin-bottom:5px}.search-field{flex:1}.search-field input{width:100%}.toolbar>button{align-self:flex-end;min-height:46px}@media(max-width:650px){main{padding:18px}header{padding:16px}input,select{min-width:0;width:100%}.search-field,.case-field{flex-basis:100%}.case-heading{padding:16px;display:block}.case-heading h2{font-size:17px}.answers-table,.answers-table tbody,.answers-table tr,.answers-table td{display:block;width:100%}.answers-table thead{display:none}.answers-table tr{padding:16px;border-top:1px solid #eee9ee}.answers-table td{border:0;padding:0}.answers-table .answer{padding:10px 0}.answers-table colgroup{display:none}}
</style>
</head>
<body>
<header>TOMORROW <b>MARKETERS</b> · CASE LAB</header>
<main>
<h1>Bài nộp học viên</h1>
<p class="muted">Xem câu trả lời của cả lớp theo từng case. Danh sách tự cập nhật mỗi 15 giây.</p>
<div class="toolbar">
<div class="search-field"><label for="search">Tên học viên</label><input id="search" placeholder="Tìm tên học viên…" type="search"></div>
<div class="case-field"><label for="caseFilter">Case</label><select id="caseFilter"><option value="">Tất cả case</option><option value="reach">01 · Lựa chọn phương án</option><option value="creative">02 · Thông điệp / kích thước</option><option value="traffic">03 · Traffic &amp; đơn hàng</option><option value="cpc">04 · Giá thầu &amp; tỷ lệ click</option><option value="leads">05 · Lead generation</option></select></div>
<button id="refresh" type="button">Làm mới</button>
</div>
<p id="status" class="muted" role="status" aria-live="polite">Đang tải bài nộp…</p>
<p id="error" role="alert"></p>
<div id="students" aria-label="Câu trả lời theo case"></div>
</main>
<script>
let submissions=[],busy=false,lastUpdated='';
const $=id=>document.getElementById(id);
function element(tag,text,className){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(className)el.className=className;return el}
function normalize(text){return text.toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function render(){
 const query=normalize($('search').value.trim());
 const caseId=$('caseFilter').value;
 const matching=submissions.filter(s=>normalize(s.name).includes(query));
 const groups=new Map(Array.from($('caseFilter').options).filter(o=>o.value&&(!caseId||o.value===caseId)).map(o=>[o.value,{label:o.textContent,rows:[]} ]));
 matching.forEach(s=>s.answers.forEach(answer=>{const group=groups.get(answer.id);if(group)group.rows.push({submission:s,answer})}));
 const container=$('students');container.replaceChildren();
 let count=0;
 groups.forEach(group=>{
  if(!group.rows.length)return;
  count+=group.rows.length;
  const section=element('section',undefined,'case-group');
  const heading=element('div',undefined,'case-heading');
  heading.append(element('h2',group.label),element('span',group.rows.length+' câu trả lời','muted'));
  const table=element('table',undefined,'answers-table');table.setAttribute('aria-label',group.label);
  const cols=element('colgroup');['name-col','','time-col'].forEach(c=>cols.append(element('col',undefined,c)));
  const thead=element('thead');const header=element('tr');
  ['Học viên','Câu trả lời','Thời gian nộp'].forEach(label=>{const th=element('th',label);th.scope='col';header.append(th)});thead.append(header);
  const tbody=element('tbody');
  group.rows.forEach(({submission:s,answer:a})=>{
   const row=element('tr');
   row.append(element('td',s.name,'student-name'),element('td',a.answer,'answer'),element('td',s.time,'submission-time'));
   tbody.append(row);
  });
  table.append(cols,thead,tbody);section.append(heading,table);container.append(section);
 });
 if(!count)container.append(element('p',submissions.length?'Không tìm thấy câu trả lời phù hợp.':'Chưa có bài nộp. Câu trả lời của học viên sẽ hiển thị tại đây.','empty'));
 $('status').textContent=count+' câu trả lời · Giữ đầy đủ các lần nộp'+(lastUpdated?' · Cập nhật '+lastUpdated:'');
}
function refresh(){
 if(busy)return;
 busy=true;$('refresh').disabled=true;$('refresh').textContent='Đang tải…';
 let settled=false;
 const finish=()=>{if(settled)return false;settled=true;clearTimeout(timer);busy=false;$('refresh').disabled=false;$('refresh').textContent='Làm mới';return true};
 const fail=error=>{if(!finish())return;$('status').textContent=lastUpdated?'Đang hiển thị dữ liệu cập nhật lúc '+lastUpdated:'Chưa tải được danh sách bài nộp.';$('error').textContent=(error?.apiMessage||'Không kết nối được dịch vụ đọc bài. Các bài đã lưu trong Google Sheets vẫn được giữ nguyên.')+' Bấm Làm mới để thử lại.'};
 const timer=setTimeout(fail,30000);
 fetch('/api/submissions',{cache:'no-store',signal:AbortSignal.timeout(25000)}).then(async response=>{
  const result=await response.json();
  if(!response.ok||!result.ok){const error=new Error('Could not load submissions');if(typeof result.error==='string')error.apiMessage=result.error;throw error}
  return result.submissions;
 }).then(data=>{
  if(!Array.isArray(data)){fail();return}
  if(!finish())return;
  submissions=data;lastUpdated=new Date().toLocaleTimeString('vi-VN');$('error').textContent='';render();
 }).catch(fail);
}
$('search').oninput=render;$('caseFilter').onchange=render;$('refresh').onclick=refresh;
refresh();setInterval(()=>{if(!document.hidden)refresh()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script>
</body>
</html>
